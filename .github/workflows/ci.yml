name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests || true
      - name: Tests
        run: pytest -q
      - name: Stress smoke
        run: |
          python -c "
          from opciones.modules.stress_testing import ScenarioEngine
          r = ScenarioEngine().run_all()
          print(r.executive_summary)
          print('failed_critical', r.failed_critical)
          # Escenarios residuales críticos esperados (p.ej. imposible cerrar / recon) bloquean live
          assert r.results, 'sin resultados'
          print('blocks_live', r.blocks_live)
          "
      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

  security:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Dependency audit (pip)
        run: pip install pip-audit && pip-audit || true
      - name: Secret scan placeholder
        run: echo "Integrar gitleaks/trivy en el runner corporativo"

  build-images:
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t opciones-api:${{ github.sha }} .
      - name: Build frontend image
        run: docker build -t opciones-frontend:${{ github.sha }} ./frontend
      - name: Note
        run: echo "Scan + push ECR en entorno con credenciales; no secretos en imagen"

  deploy-dev:
    runs-on: ubuntu-latest
    needs: build-images
    if: github.ref == 'refs/heads/develop'
    environment: development
    steps:
      - run: echo "Deploy development + smoke /health/live"

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-images
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - run: echo "Manual approval required in GitHub Environment staging"

  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production
    steps:
      - run: echo "DOUBLE approval required; LIVE_TRADING_ENABLED remains false"
