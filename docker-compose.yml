services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opciones
      POSTGRES_PASSWORD: opciones
      POSTGRES_DB: opciones
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opciones -d opciones"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+psycopg://opciones:opciones@db:5432/opciones
      REDIS_URL: redis://redis:6379/0
      TRADING_MODE: paper
      LIVE_TRADING_ENABLED: "false"
      EMERGENCY_STOP: "true"
      DASHBOARD_JWT_SECRET: change-me-in-production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn opciones.api.app:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api

volumes:
  pgdata:
