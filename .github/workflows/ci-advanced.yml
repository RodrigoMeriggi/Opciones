name: CI Advanced

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  PYTHON_VERSION: "3.12"
  COVERAGE_MIN_TOTAL: "35"
  COVERAGE_MIN_RISK: "50"
  COVERAGE_MIN_PRICING: "50"

jobs:
  format-lint-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: pip install -e ".[dev]" ruff mypy
      - name: Format check
        run: ruff format --check src tests || true
      - name: Lint
        run: ruff check src tests || true
      - name: Type check (best effort modules críticos)
        run: mypy src/opciones/modules/risk_manager src/opciones/modules/pricing_engine --ignore-missing-imports || true

  unit:
    runs-on: ubuntu-latest
    needs: format-lint-types
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e ".[dev]"
      - name: Unit tests + coverage
        run: |
          pytest tests/unit -q --cov=opciones --cov-report=xml:reports/coverage/unit.xml --cov-report=term-missing
          python scripts/ci/check_coverage_gates.py

  integration-contract:
    runs-on: ubuntu-latest
    needs: format-lint-types
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e ".[dev]"
      - run: pytest tests/integration tests/contract -q

  e2e-regression-resilience:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e ".[dev]"
      - name: E2E + regression + resilience + performance
        run: |
          pytest tests/e2e tests/regression tests/resilience tests/performance -q --tb=short
      - name: Stress smoke
        run: |
          python -c "
          from opciones.modules.stress_testing import ScenarioEngine
          r = ScenarioEngine().run_all()
          print(r.executive_summary)
          assert r.results
          "

  security:
    runs-on: ubuntu-latest
    needs: format-lint-types
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e ".[dev]" pip-audit
      - name: Security tests
        run: pytest tests/security -q
      - name: Dependency scan
        run: pip-audit -r <(pip freeze) || pip-audit || true
      - name: Secret scan (heuristic)
        run: |
          python scripts/ci/secret_scan.py
      - name: SBOM stub
        run: |
          mkdir -p reports/security
          pip freeze > reports/security/sbom-requirements.txt
          echo "SBOM stub generated" > reports/security/sbom-note.txt

  infra-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Terraform fmt/validate (si existe)
        run: |
          if command -v terraform >/dev/null 2>&1 && [ -d infra/terraform ]; then
            cd infra/terraform
            terraform fmt -check -recursive || true
            terraform init -backend=false
            terraform validate
          else
            echo "terraform no instalado o sin infra; skip soft"
            ls infra/terraform || true
          fi

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

  build-artifacts:
    runs-on: ubuntu-latest
    needs: [unit, integration-contract, e2e-regression-resilience, security, frontend]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -t opciones-api:${{ github.sha }} .
          docker build -t opciones-frontend:${{ github.sha }} ./frontend
      - name: Version manifest
        run: python scripts/ci/write_version_manifest.py ${{ github.sha }}
      - name: Upload artifacts note
        run: |
          mkdir -p reports/artifacts
          echo "images=opciones-api:${{ github.sha }},opciones-frontend:${{ github.sha }}" > reports/artifacts/published.txt

  deploy-development:
    runs-on: ubuntu-latest
    needs: build-artifacts
    if: github.ref == 'refs/heads/develop'
    environment: development
    steps:
      - run: echo "Auto-deploy development + smoke /health"
      - run: echo "Worker deploy must follow scripts/ci/worker_safe_deploy.md"

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-artifacts
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - run: echo "Staging requires GitHub Environment approval"
      - run: echo "Smoke + health checks post-deploy"

  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production
    steps:
      - run: echo "DOUBLE approval required"
      - run: echo "LIVE_TRADING_ENABLED remains false unless operational activation"
      - run: echo "Rollback plan: scripts/ci/rollback.md"
